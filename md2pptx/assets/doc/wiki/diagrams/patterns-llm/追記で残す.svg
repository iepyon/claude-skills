<svg width="340" height="320" viewBox="0 0 340 320" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <text x="30" y="34" font-family="sans-serif" font-size="13" fill="#4B5563">出来事（追記だけ）</text>

