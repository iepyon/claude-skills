  <text x="252" y="222" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1E40AF">拾い直せる</text>

  <text x="170" y="276" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1F2937">外れは、次のゴールから見れば材料</text>
