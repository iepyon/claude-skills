<svg width="340" height="320" viewBox="0 0 340 320" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <text x="24" y="34" font-family="sans-serif" font-size="13" fill="#9CA3AF">差し替わる</text>
  <rect x="24" y="46" width="124" height="38" rx="4" fill="none" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="86" y="70" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#9CA3AF">目的 v1</text>
  <rect x="24" y="98" width="124" height="38" rx="4" fill="none" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="86" y="122" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#9CA3AF">目的 v2</text>
  <rect x="24" y="150" width="124" height="38" rx="4" fill="none" stroke="#4B5563" stroke-width="1.5"/>
  <text x="86" y="174" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4B5563">目的 v3</text>

  <line x1="152" y1="65" x2="190" y2="65" stroke="#9CA3AF" stroke-width="1"/>
  <line x1="152" y1="117" x2="190" y2="117" stroke="#9CA3AF" stroke-width="1"/>
  <line x1="152" y1="169" x2="190" y2="169" stroke="#4B5563" stroke-width="1.5"/>

  <text x="196" y="34" font-family="sans-serif" font-size="13" fill="#1E40AF">動かさない</text>
  <rect x="196" y="46" width="118" height="150" rx="4" fill="none" stroke="#1E40AF" stroke-width="1.5"/>
  <text x="255" y="72" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1E40AF">物差し</text>
  <line x1="208" y1="86" x2="302" y2="86" stroke="#9CA3AF" stroke-width="1"/>
  <text x="255" y="108" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4B5563">読み返されたか</text>
  <line x1="208" y1="122" x2="302" y2="122" stroke="#9CA3AF" stroke-width="1"/>
  <text x="255" y="144" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4B5563">人に渡せたか</text>
  <line x1="208" y1="158" x2="302" y2="158" stroke="#9CA3AF" stroke-width="1"/>
  <text x="255" y="180" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4B5563">問いが増えたか</text>

  <text x="170" y="234" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4B5563">目的が変わっても、測り方は変えない</text>
  <line x1="60" y1="256" x2="280" y2="256" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="170" y="294" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1F2937">先に置いた物差しだけが、比べさせる</text>
</svg>
