# サイトに並べるデッキの順序（サイドバーの並びと、Shift+←→ で送る順）。
#
# 拡張子を除いたファイル名で書く。ファイル名は `[[deck/slide]]` のリンク先でもあるので、
# 並び替えのためにリネームするとサイト中のリンクが折れる。順序はここで変える。
#
# ここに無い md はこの後ろへファイル名順で続く（追記を忘れても消えない）。
# 逆に、ここに書いたのに存在しないデッキ名はビルドを止める。
#
# パターンのデッキは2部構成。第1部（intro-*）が背景・目的とショートストーリー、
# 第2部（patterns-*）がパターンのカタログ。対になるので必ず隣り合わせに置く。
decks:
  - guide # 機能ガイド。読み方の説明なので先頭
  - intro-human # 第1部: なぜ Wiki を育てるのか
  - patterns-human # 第2部: 人が育てる Wiki のパターン
  - intro-llm # 第1部: なぜ AI に手入れを任せるのか
  - patterns-llm # 第2部: LLM が手入れする Wiki のパターン
  - intro-agent # 第1部: なぜゴールを渡さないのか
  - patterns-agent # 第2部: 自律エージェントのパターン
  - intro-scrum # 第1部: なぜゴールを先に決めないのか
  - patterns-scrum # 第2部: ゴールを後から見つけるスクラムのパターン
