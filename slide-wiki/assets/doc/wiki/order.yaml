# サイトに並べるデッキの順序（サイドバーの並びと、←→ で送る順）。
#
# 拡張子を除いたファイル名で書く。ファイル名は `[[deck/slide]]` のリンク先でもあるので、
# 並び替えのためにリネームするとサイト中のリンクが折れる。順序はここで変える。
#
# ここに無い md はこの後ろへファイル名順で続く（追記を忘れても消えない）。
# 逆に、ここに書いたのに存在しないデッキ名はビルドを止める。
#
# パターンのデッキは2部構成。第1部（intro-*）が背景・目的とショートストーリー、
# 第2部（patterns-*）がパターンのカタログ。対になるので必ず隣り合わせに置く。
decks:
  - guide # 機能ガイド。読み方の説明なので先頭
  - intro-wiki # 第1部: なぜ Wiki を育てるのか
  - patterns-wiki # 第2部: 人が育てる Wiki のパターン
  - intro-llm-wiki # 第1部: なぜ AI に手入れを任せるのか
  - patterns-llm-wiki # 第2部: LLM が手入れする Wiki のパターン
  - intro-delegation # 第1部: なぜ「AI に任せる」を割るのか
  - patterns-delegation # 第2部: 任せ先を選ぶパターン
  - intro-solutions # 第1部: 同じ話を、市場にある部品の名前で（LLM との差分）
  - patterns-solutions # 第2部: 13の部品を LLM との差分で引く
  - patterns-meta # パターンを書くパターン。第1部はまだ無い（対の intro-meta を書いたら隣へ）
  - index # 索引。送りはここで止まるので、最後の1枚から先頭へ戻す
