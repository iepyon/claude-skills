# サイトに並べるデッキの順序（サイドバーの並びと、←→ で送る順）。
#
# 拡張子を除いたファイル名で書く。ファイル名は `デッキ名.md#…` のリンク先そのものなので、
# 並び替えのためにリネームするとサイト中のリンクが折れる。順序はここで変える。
#
# ここに無い md はこの後ろへファイル名順で続く（追記を忘れても消えない）。
# 逆に、ここに書いたのに存在しないデッキ名はビルドを止める。
#
# **グループは OKF の目録（生成される index.md）の見出しになる。**
# 送りの順はグループを平坦に均した順なので、1本の列だったころと変わらない。
# 増えたのはグループ名という情報1つで、以前はコメントにしか書けなかった
# 「第1部と第2部は対」という意図が、機械にも読める場所へ移った。
#
# `index` と `log` は OKF の予約ファイル名なので、デッキ名にできない
# （目録と更新履歴として生成する。SPEC.md §8・§9）。索引のデッキが `map` なのはそのため。
groups:
  - title: ガイド
    decks:
      - guide # 機能ガイド。読み方の説明なので先頭

  # パターンのデッキは2部構成。第1部（intro-*）が背景・目的とショートストーリー、
  # 第2部（patterns-*）がパターンのカタログ。対になるので同じグループに置く。
  - title: 人が育てる Wiki
    decks:
      - intro-wiki # 第1部: なぜ Wiki を育てるのか
      - patterns-wiki # 第2部: 人が育てる Wiki のパターン

  - title: パターンを書く
    decks:
      - intro-meta # 第1部: パターンを書きはじめる前に（入門）
      - patterns-meta # 第2部: パターンを書くパターン

  - title: スライドを育てる
    decks:
      - intro-slidewiki # 第1部: なぜスライドを育てるのか
      - patterns-slidewiki # 第2部: スライドが育つパターン

  - title: 索引
    decks:
      - map # 送りはここで止まるので、最後の1枚から先頭へ戻す
