# パターン間の関係。宣言（型の語彙と代数）は ../../../ontology.yaml の relations 節。
#
# **本文の写しではなく、既にある散文リンクへの型付けである。** ここに辺を足しても
# 本文にリンクが無ければ lint が落とすし、本文のリンクをここで分類し忘れても落ちる。
# 関連は文中に溶かすままで、この表は「その1本が上下なのか、対なのか」だけを言う。
#
# **型の名前は、相手が自分にとって何であるかを言う**（`A 上位 B` = B は A の上位）。
# サイトはこの名前を1枚のページの見出しに使うので、向きを型ごとに読み替えさせない。
#
# 片側だけ書く（逆向きはローダが導出する）:
#   上位 ⇄ 下位 / 先行 ⇄ 後続 は相手の名前で裏返り、同位 と 対 はそのまま裏返る。
#   検算 だけは裏返らない（要るのは検算される側の一枚だけ）。
version: 1

# 型付けが済んでいるデッキ。ここに無いデッキのリンクは「まだ分類していない」であって
# 「分類し忘れた」ではない
decks:
  - patterns-meta.md

edges:
  # ── 門（3ストライクで書く）が、どの一枚より前に来るか ───────────
  - from: patterns-meta.md#ザワつく状況
    rel: 先行
    to: patterns-meta.md#3ストライクで書く
    note: ":208 3ストライクで書く 前に、枠だけ埋めてしまう／:101 3度で ザワつく状況 が見え、構造が残る"
  - from: patterns-meta.md#黙って聴く著者
    rel: 先行
    to: patterns-meta.md#3ストライクで書く
    note: ":345 3ストライクで書く を経た原稿を、場に出す"
  - from: patterns-meta.md#ときめく解法
    rel: 検算
    to: patterns-meta.md#3ストライクで書く
    note: ":240 独りよがりは 3ストライクで書く が落とす"

  # ── 名前 ────────────────────────────────────────────────────────
  - from: patterns-meta.md#ジワる名前
    rel: 下位
    to: patterns-meta.md#メタファ
    note: ":147 借り物なら手間はゼロ。ジワる名前 になる／:125 説明は本文と メタファ が引き受ける"
  - from: patterns-meta.md#メタファ
    rel: 同位
    to: patterns-meta.md#ドメイン言語
    note: ":148 説明が要る比喩なら、ドメイン言語 に替える／:161 メタファ を探したが、どれも少しずつずれる"
  - from: patterns-meta.md#往復切符
    rel: 先行
    to: patterns-meta.md#ジワる名前
    note: ":184 効いた打ち手に ジワる名前 を付け、一枚にする（往復切符 の場面）"

  # ── 往復切符（対を要求するパターン自身）─────────────────────────
  - from: patterns-meta.md#往復切符
    rel: 上位
    to: patterns-meta.md#不揃いの石畳
    note: ":189 一方通行だけでは、不揃いの石畳 に噛み合わない"
  - from: patterns-meta.md#往復切符
    rel: 下位
    to: patterns-meta.md#ザワつく状況
    note: ":194 どちらが勝つかは ザワつく状況 が決める"

  # ── 振る舞い ────────────────────────────────────────────────────
  - from: patterns-meta.md#ときめく解法
    rel: 同位
    to: patterns-meta.md#ザワつく状況
    note: ":239 諦めた採算は ザワつく状況 に書く"
  - from: patterns-meta.md#たのしい釣り方
    rel: 下位
    to: patterns-meta.md#ザワつく状況
    note: ":216 諦めるものまで書けば、たのしい釣り方 になる／:254 ザワつく状況 を伏せ、効いた形だけ渡す"
  - from: patterns-meta.md#たのしい釣り方
    rel: 下位
    to: patterns-meta.md#ラフで出す
    note: ":263 工夫の余地の残し方は ラフで出す／:281 本文が たのしい釣り方 と書いても、図が残る"
  - from: patterns-meta.md#ラフで出す
    rel: 下位
    to: patterns-meta.md#ザワつく状況
    note: ":285 ザワつく状況 が見えれば、それでよい"

  # ── 繋がり ──────────────────────────────────────────────────────
  - from: patterns-meta.md#不揃いの石畳
    rel: 下位
    to: patterns-meta.md#文に溶かす
    note: ":377 繋ぎ方は 文に溶かす／:308「ここで 不揃いの石畳 が効く」と書けば目に入る"
  - from: patterns-meta.md#文に溶かす
    rel: 下位
    to: patterns-meta.md#ジワる名前
    note: ":309 それが ジワる名前 なら、辿らずとも通る"

  # ── 仕上げ（声に出して読む が言語じゅうの検算を引き受ける）───────
  - from: patterns-meta.md#声に出して読む
    rel: 対
    to: patterns-meta.md#黙って聴く著者
    note: ":353 著者は黙り、声に出すのは読者の役。対で効く。／:322 黙って聴く著者 の場に出す前に"
  - from: patterns-meta.md#ジワる名前
    rel: 検算
    to: patterns-meta.md#声に出して読む
    note: ":124 理屈で選ぶと薄れる。声に出して読む と効いてくる／:332 ジワる名前 も…耳で分かる"
  - from: patterns-meta.md#ドメイン言語
    rel: 検算
    to: patterns-meta.md#声に出して読む
    note: ":171 定義は一箇所に置き、声に出して読む"
  - from: patterns-meta.md#文に溶かす
    rel: 検算
    to: patterns-meta.md#声に出して読む
    note: ":332 ジワる名前 も 文に溶かす 一行も、耳で分かる"
