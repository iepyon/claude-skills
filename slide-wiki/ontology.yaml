# slide-wiki スライド Markdown のオントロジー（SSoT）
#
# このファイルが「md の構造」の唯一の正本(Single Source of Truth)。
# - 実装（src/plugins/registry.ts・src/schema/validation.ts・src/ontology/lint.ts）は
#   src/ontology/ 経由でここを読む。ディレクティブ・上限・語彙をコードに再定義しない。
# - 人間/AI 可読な ../ontology.md と SKILL.md の生成領域は
#   `npx tsx src/tools/gen-ontology-doc.ts` でここから生成する（手編集禁止）。
#
# なぜ要るか: slide-wiki は「Claude がドキュメントを読んで機械的に使う」スキルなので、
# md の構造が宣言されていないことがそのまま生成品質の劣化になる。実際これまで
# lean-canvas の9ブロック名・カスタマージャーニーの行ラベル・pattern-language の
# メタキーは**コードの中のリテラルにしか存在せず**、語彙外の見出しは黙って消えていた。
#
# 用語:
#   element    = md の骨格要素（deck / title-slide / content-slide / section / subsection / body）。
#                marker（行頭記号）で認識される。
#   annotation = 要素に付ける注釈ディレクティブ（<!--id:--> <!--icon:--> <!--takeaway-->）。
#                レイアウトを選ばない。どのレイアウトで効くかは layouts[].annotations が宣言する。
#   layout     = スライド1枚の型（= SlideLayout の _tag）。directives で選び、slots を宣言する。
#   slot       = そのレイアウトで `###` / `####` が持つ意味。**「### に何を書けばよいか」の正本。**
#                marker・cardinality・heading（free か vocabulary）・body の読まれ方を宣言する。
#   vocabulary = slot の見出し名として許される語彙（別名つき）。語彙外の扱い(unknown)も宣言する。
#   field-set  = `key: value` 形式のメタ。現在 pattern-language ブロックだけが持つ。
#   inline     = 本文中の記法と、それが効く場所。
#
# スキーマ版。生成物のヘッダに ontology-version として刻む（どの版で射影したか追えるように）。
# 1: 初版（md の要素・注釈・16レイアウト・語彙・メタキー・制限を宣言）
# 2: 図解を外部ファイルにする。image 要素を足し、枠を数える marker に画像参照を加えた
#    （WikiPattern の図解は ```pattern-diagram フェンスから `![…](….svg)` へ移した）
version: 2

# ── md の骨格要素 ───────────────────────────────────────────────────
# 行頭記号で認識される構造。ここに無い記法はすべて body（＝本文テキスト）に落ちる。
elements:
  deck:
    label: デッキ
    description: 1つの Markdown ファイル。`---` で区切られたスライドの列。
    guidance: |
      文書全体の frontmatter は持たない。先頭の `---` もスライド区切りとして読まれるので、
      `---\nname: x\n---` と書くと1枚目が「name: x」だけのスライドになる。
  slide-break:
    marker: "---"
    label: スライド区切り
    description: スライドの境目。行全体が `---` のときだけ区切りになる。
  title-slide:
    marker: "#"
    label: タイトルスライド
    description: H1 で始まるスライド。直後の本文行がサブタイトルになる。
    guidance: デッキ名（Wiki のサイドバー見出し）は先頭のタイトルスライドから採られる。
  content-slide:
    marker: "##"
    label: コンテンツスライド
    description: H2 で始まるスライド。レイアウトは directive で選ぶ（無指定なら Default）。
  section:
    marker: "###"
    label: セクション
    description: スライド内の区画。何を意味するかは選んだレイアウトの slots が決める。
  subsection:
    marker: "####"
    label: サブセクション
    description: 区画の中の行ラベル。CustomerJourney と PatternLanguage だけが使う。
  image:
    marker: "![alt](src)"
    label: 画像
    description: 行まるごとの画像参照。中身は生成時に読み込んで埋め込む。
    guidance: |
      パスは**その md ファイルからの相対**。図解の枠を持つレイアウト（WikiPattern）だけが読み、
      他のレイアウトでは描かれない（lint が報告する）。外部ファイルにしてあるのは、
      **md をそのまま GitHub で開いても図が絵として表示される**ようにするため
      — 図の中身を md に書き込むと、読み手には SVG のソースが見えるだけになる。
  body:
    label: 本文
    description: 見出しに属する本文行。`- ` `* ` `+ ` の箇条書きと `1. ` の番号付きリストを含む。
    guidance: |
      PPTX はネイティブのバレット/自動番号、HTML は CSS 疑似要素で記号を描く。
      **リテラルの `•` を書いてはいけない**（記号が二重に表示される）。ネストは1階層のみ。

# ── 注釈ディレクティブ ─────────────────────────────────────────────
# レイアウトを選ばない `<!--…-->`。どのレイアウトで効くかは layouts[].annotations が正本
# （ここに逆リストを持たせると二重管理になる）。
annotations:
  - name: id
    syntax: "<!--id:<slug>-->"
    pattern: '^<!--id:(.+?)-->$'
    applies-to: [content-slide, title-slide]
    cardinality: one
    description: スライドの ID。`[[…]]` の解決先であり HTML の `#hash` でもある。
    guidance: |
      省略するとスライドタイトルの slug を採り、衝突したら連番（`-2`）を付ける。
      採番は parser/slide-ids.ts が一括で行う。

      **明示した ID は予約である。** 他のスライドの見出しから作られた自動 slug より強く、
      同じ綴りを欲しがった見出しのほうが連番に回る。したがって `[[…]]` の行き先は
      md の並び順で変わらない。

      **明示 ID 同士がぶつかった場合は一意化を続ける**（重複するとリンクが解決できない）。
      どちらが間違っているかは機械には決められないので、lint の `slide-id` が
      両方の行番号を報告する（`--strict` で終了コード 1）。折れたリンクと違い
      `[[…]]` は解決してしまう — 常に最初の1枚へ — ので、報告が無いと気づけない。
    example: "<!--id:seed-->"
  - name: icon
    syntax: "<!--icon:mi:<name>-->" # または <!--icon:<emoji>-->
    pattern: '^<!--icon:(.+)-->$'
    applies-to: [section]
    cardinality: one
    description: セクションのアイコン。`mi:` 接頭辞で Material Icons、それ以外は絵文字。
    guidance: 効くのは annotations に icon を挙げたレイアウトだけ。他では黙って捨てられる。
    example: "<!--icon:mi:search-->"
  - name: takeaway
    syntax: "<!--takeaway-->"
    pattern: '^<!--takeaway-->$'
    applies-to: [content-slide]
    cardinality: one
    position: last
    description: スライド末尾の出典・まとめ。マーカーの次の行以降が本文になる。
    guidance: 効くのは annotations に takeaway を挙げたレイアウトだけ。
    example: "<!--takeaway-->"
  - name: source
    syntax: "<!--source-->"
    pattern: '^<!--source-->$'
    applies-to: [content-slide]
    cardinality: one
    position: before-takeaway
    description: そのスライドの主張の典拠。マーカーの次の行以降が本文になる。
    guidance: |
      **`takeaway` とは役割が違う。** takeaway は読み手に次を示す「まとめ・関連」で、
      本文と同じ大きさで中央に置く。`source` は主張がどこから来たかの**典拠**で、
      本文の1/3以下の大きさで下端に伏せる（読まずに飛ばせることが要件）。

      **`[[…]]` を書いてもリンクにならない。** 出典は参照ではないので、
      バックリンクのグラフに載せない（載せると「関連」と「典拠」が混ざり、
      文献名がパターンの隣人として並ぶ）。

      **書く順と出る順は逆になる。** md では `<!--takeaway-->` の**前**に置くが、
      描かれるのは takeaway の**下**（スライドの最下端）。takeaway はそのぶん
      持ち上がる。両方を素朴に下端へ置くと重なり、小さい出典のほうが隠れる。

      効くのは annotations に source を挙げたレイアウトだけ。
      挙げていないレイアウトに書くと本文ごと消えるので、lint が
      `annotation-scope` で報告する（`--strict` で終了コード 1）。
    example: "<!--source-->"

# ── レイアウト ─────────────────────────────────────────────────────
# name          = SlideLayout の _tag（プラグインの layoutTag）。実装との結合キー。
# label         = ドキュメントの表に出す表示名
# plugin        = 対応するプラグイン id（コアレイアウトは null）
# directives    = 選ぶための記法。syntax は表示用、pattern は正規表現で認識するものだけ。
#                 kind: code-fence はトークナイザが特別扱いする（コメントではない）。
# annotations   = このレイアウトで効く注釈（上記 annotations の name）
# max-chars     = 文字数上限の上書き。省略時は limits.max-chars-per-slide
# leading-body  = ディレクティブと最初の `###` の間に置く本文の意味（無いレイアウトは省略）
# slots         = `###` / `####` の意味。marker に ```<lang> を書くと、その言語で開かれた
#                 コードフェンスを1つの枠として数える。marker に `![…](….svg)` の形を書くと
#                 画像参照の行を1つの枠として数え、末尾の拡張子が受理する種類になる。
#                 cardinality は "1..n" / "3" / "3..n" / "0..1" /
#                 "rows*cols"（ディレクティブの引数から解決）。
#                 heading: free（名前は自由）| vocabulary（vocabularies の語彙に従う）
#                 body: free | lines | bullets-only | none
# produces      = 1ブロックから複数スライドを作るレイアウトの、生成される _tag の並び
layouts:
  - name: Default
    label: Default
    plugin: null
    directives: []
    description: セクションを縦に並べる
    annotations: [id, takeaway]
    slots:
      - name: sections
        marker: "###"
        cardinality: "0..n"
        heading: free
        body: free
        description: |
          見出しと本文の組。上から順に縦に積まれる。`###` を書かず本文だけを置くと、
          見出しの無いセクション1件として扱われる（だから 0 件でも成立する）。
    example: |
      ## スライドタイトル
      ### 見出しA
      本文テキスト
      ### 見出しB
      本文テキスト

  - name: LeftRight
    label: LeftRight
    plugin: null
    directives:
      - syntax: "<!--left:N-->"
        pattern: '^<!--left:(\d+)-->$'
      - syntax: "<!--right:M-->"
        pattern: '^<!--right:(\d+)-->$'
    description: 左右分割（比率指定）
    guidance: N・M は整数の比率。`right` は `left` より後に置く（前に置くと ParseError）。
    annotations: [id, takeaway]
    slots:
      - name: sections
        marker: "###"
        cardinality: "0..n"
        heading: free
        body: free
        description: 直前のディレクティブが指す側（左/右）に積まれる。本文だけでも成立する。
    example: |
      ## タイトル
      <!--left:2-->
      ### 左側
      左の内容
      <!--right:1-->
      ### 右側
      右の内容

  - name: TopBottom
    label: TopBottom
    plugin: null
    directives:
      - syntax: "<!--top:N-->"
        pattern: '^<!--top:(\d+)-->$'
      - syntax: "<!--bottom:M-->"
        pattern: '^<!--bottom:(\d+)-->$'
    description: 上下分割（比率指定）
    guidance: N・M は整数の比率。`bottom` は `top` より後に置く（前に置くと ParseError）。
    annotations: [id, takeaway]
    slots:
      - name: sections
        marker: "###"
        cardinality: "0..n"
        heading: free
        body: free
        description: 直前のディレクティブが指す側（上/下）に積まれる。本文だけでも成立する。
    example: |
      ## タイトル
      <!--top:3-->
      ### 上側
      上の内容
      <!--bottom:2-->
      ### 下側
      下の内容

  - name: Grid
    label: Grid
    plugin: null
    directives:
      - syntax: "<!--grid:RxC-->"
        pattern: '^<!--grid:(\d+)x(\d+)-->$'
    description: R行×C列のグリッド
    guidance: フォントサイズは R×C から自動で決まる（1x1 が最大、4x4 が最小）。
    annotations: [id, takeaway]
    slots:
      - name: cells
        marker: "###"
        cardinality: "rows*cols"
        heading: free
        body: free
        description: セル。左上から行優先で埋まる。件数が R×C と違うと空セルか溢れになる。
    example: |
      ## タイトル
      <!--grid:2x2-->
      ### セル1
      内容1
      ### セル2
      内容2
      ### セル3
      内容3
      ### セル4
      内容4

  - name: IconColumn
    label: IconColumns
    plugin: icon-cols
    directives:
      - syntax: "<!--icon-cols-->"
    description: アイコン付き3カラム
    guidance: |
      **3件ちょうど**を想定する。2件以下だとこのレイアウトとして認識されず Default に落ち、
      4件以上だと4件目以降が黙って捨てられる（BACKLOG B-07 で可変化を検討中）。
    annotations: [id, icon, takeaway]
    slots:
      - name: columns
        marker: "###"
        cardinality: "3"
        heading: free
        body: free
        description: カラム。見出し・`<!--icon:-->`・本文の順に書く。
    example: |
      ## タイトル
      <!--icon-cols-->
      ### 1. 自己認識
      <!--icon:mi:search-->
      無意識的な前提を特定する力。
      ### 2. 率直さ
      <!--icon:💬-->
      前提の崩壊を認める誠実さ。
      ### 3. 責任
      <!--icon:⚓-->
      不確実性を引き受ける覚悟。

  - name: IconCard
    label: IconCards
    plugin: icon-cards
    directives:
      - syntax: "<!--icon-cards-->"
    description: アイコン付きカード
    guidance: IconColumns と同じく **3件ちょうど**を想定する（過不足の扱いも同じ）。
    annotations: [id, icon, takeaway]
    slots:
      - name: columns
        marker: "###"
        cardinality: "3"
        heading: free
        body: free
        description: カード。見出し・`<!--icon:-->`・本文の順に書く。
    example: |
      ## タイトル
      <!--icon-cards-->
      ### 認知科学
      <!--icon:mi:psychology-->
      人間の思考プロセスを理解する研究分野。
      ### コーディング
      <!--icon:mi:code-->
      効率的なアルゴリズムで構築する。
      ### 自動化
      <!--icon:mi:auto_awesome-->
      反復タスクを自動化する。

  - name: Steps
    label: Steps
    plugin: steps
    directives:
      - syntax: "<!--steps-->"
    description: 階段状のステップ表示
    guidance: 3件未満だとこのレイアウトとして認識されず Default に落ちる。
    annotations: [id, icon, takeaway]
    slots:
      - name: steps
        marker: "###"
        cardinality: "3..n"
        heading: free
        body: lines
        description: |
          ステップ。見出し・`<!--icon:-->`・本文の順に書く。本文は**1行目が役割名**、
          2行目以降が説明になる（行の位置に意味がある唯一のレイアウト）。
    example: |
      ## タイトル
      <!--steps-->
      ### 見る
      <!--icon:mi:visibility-->
      観察者
      全体像を理解し 各フェーズの目的を 説明できる
      ### 習う
      <!--icon:mi:school-->
      見習い
      先輩を手本に スクリプトを組む
      ### 実践
      <!--icon:mi:directions_run-->
      実践者
      自律的に判断し 適切な手法を 選択できる

  - name: NumberedList
    label: NumberedList
    plugin: numbered-list
    directives:
      - syntax: "<!--numbered-list:circle-->"
        pattern: '^<!--numbered-list:(circle|bar)-->$'
    description: 番号付きリスト（意匠は `circle` か `bar`）
    guidance: "`<!--numbered-list:circle-->`（丸）か `<!--numbered-list:bar-->`（帯）のどちらかを書く。"
    annotations: [id, takeaway]
    slots:
      - name: items
        marker: "###"
        cardinality: "1..n"
        heading: free
        body: free
        description: 項目。番号は自動採番される（見出しに番号を書かない）。
    example: |
      ## タイトル
      <!--numbered-list:circle-->
      ### 仮説を立てる
      観察事実から「〜ならば〜だろう」の形で書く。
      ### 検証計画を作る
      仮説ごとに反証シグナルを設計する。
      <!--takeaway-->
      仮説検証は1週間スプリントで回すこと

  - name: CodeDisplay
    label: CodeDisplay
    plugin: null
    directives:
      - syntax: "```<language>"
        kind: code-fence
    description: シンタックスハイライト付きコード
    guidance: |
      文字数制限の対象外（タイトルだけ数える）。コードフェンスの**後ろ**に書いた本文は
      キャプションになる。
    annotations: [id]
    leading-body: なし（コードフェンスの後の本文がキャプションになる）
    slots: []
    example: |
      ## TypeScript コード例

      ```typescript
      interface User {
        id: number
        name: string
      }
      ```

      型安全なユーザー型。

  - name: TextOnly
    label: TextOnly
    plugin: text-only
    directives:
      - syntax: "<!--text-only-->"
    description: 自由形式テキスト
    annotations: [id, takeaway]
    leading-body: 本文そのもの。空行で段落が分かれる。
    slots: []
    example: |
      ## エグゼクティブサマリー
      <!--text-only-->
      本レポートは、開発者が直面する構造的な問題を分析したものです。

      分析の結果、単なる時間管理の問題ではないことが明らかになりました。

  - name: Table
    label: Table
    plugin: table
    directives:
      - syntax: "<!--table-->"
    description: テーブル表示（ディレクティブの後にパイプ区切りの表を置く）
    guidance: |
      ディレクティブの後にパイプ区切りの表を置く。`| --- |` の区切り行が必要。
      セル内のテキストはプラグインが直接描くので `[[…]]` は効かない（BACKLOG B-22）。
    annotations: [id, takeaway]
    leading-body: パイプ区切りのテーブル本体。
    slots: []
    example: |
      ## 機能比較
      <!--table-->
      | 機能 | Basic | Pro |
      | --- | --- | --- |
      | ユーザー数 | 5名 | 50名 |
      | サポート | メール | 優先対応 |

  - name: Quote
    label: Quote
    plugin: quote
    directives:
      - syntax: "<!--quote-->"
    description: 引用・名言スライド
    annotations: [id]
    leading-body: 引用文そのもの。複数行・複数段落も可。
    slots:
      - name: author
        marker: "###"
        cardinality: "0..1"
        heading: free
        body: none
        description: 著者名。省略可（引用文だけのスライドになる）。
    example: |
      ## 名言 — イノベーション
      <!--quote-->
      イノベーションとは、優れたアイデアに「イエス」と言うことではない。
      ### Steve Jobs

  - name: Agenda
    label: Agenda
    plugin: agenda
    directives:
      - syntax: "<!--agenda-->"
    description: TOC/アジェンダ
    guidance: 項目は `[[…]]` でリンクにでき、Wiki の目次として機能する。
    annotations: [id]
    leading-body: サブタイトル（省略可）。
    slots:
      - name: items
        marker: "###"
        cardinality: "1..n"
        heading: free
        body: none
        description: アジェンダ項目。本文は持たない。
    example: |
      ## Agenda
      <!--agenda-->
      本日のプログラム
      ### イントロダクション
      ### 市場分析
      ### Q&A

  - name: LeanCanvas
    label: LeanCanvas
    plugin: lean-canvas
    directives:
      - syntax: "<!--lean-canvas-->"
    description: リーンキャンバス
    guidance: |
      **見出し名が配置を決める**（書いた順ではない）。語彙外の見出しはどのマスにも
      入らず黙って消えるので、下記 lean-canvas-blocks の語彙から選ぶ。
    annotations: [id]
    slots:
      - name: blocks
        marker: "###"
        cardinality: "1..9"
        heading: vocabulary
        vocabulary: lean-canvas-blocks
        body: free
        description: 9ブロックのいずれか。同じブロックを2回書くと後勝ちになる。
    example: |
      ## リーンキャンバス
      <!--lean-canvas-->
      ### 課題
      - 開発コスト高
      ### ソリューション
      - テンプレート提供
      ### 独自の価値提案
      最速でMVP構築できる統合プラットフォーム

  - name: CustomerJourney
    label: CustomerJourney
    plugin: customer-journey
    directives:
      - syntax: "<!--カスタマージャーニー:-->"
    description: カスタマージャーニーマップ
    guidance: |
      フェーズが5件以上あると4件ずつのスライドに自動分割され、タイトルに `(1/2)` が付く。
    annotations: [id]
    slots:
      - name: phases
        marker: "###"
        cardinality: "1..n"
        heading: free
        body: none
        description: フェーズ（列）。名前は自由。
      - name: rows
        marker: "####"
        cardinality: "1..4"
        heading: vocabulary
        vocabulary: journey-rows
        body: bullets-only
        description: |
          行ラベル。**`- ` で始まる行しか読まれない**（素の本文行は黙って捨てられる）。
    example: |
      ## カスタマージャーニー
      <!--カスタマージャーニー:-->
      ### 認知
      #### タッチ:
      - Web検索
      #### 行動:
      - 情報収集
      #### 判断:
      - 課題解決できそう
      #### 感情:
      - 期待感

  - name: PatternLanguageOverview
    label: PatternLanguage
    plugin: pattern-language
    directives:
      - syntax: "<!--pattern-language-a-->"
    description: パターン・ランゲージ。1ブロックから概要ページ + 詳細ページの2スライドを生成
    guidance: |
      このスキルで唯一 `key: value` のメタを持つレイアウト。最初の `###` までがメタ、
      それ以降が本文。本文の節名も語彙で決まる（語彙外の節は中身ごと黙って捨てられる）。
    max-chars: 1024
    produces: [PatternLanguageOverview, PatternLanguageDetail]
    field-set: pattern-meta
    annotations: [id]
    leading-body: "メタ（`key: value` の並び）。最初の `###` でメタ相が終わる。"
    slots:
      - name: sections
        marker: "###"
        cardinality: "1..n"
        heading: vocabulary
        vocabulary: pattern-sections
        body: free
        description: パターンの節。節ごとに本文の読まれ方が違う（語彙の説明を見る）。
      - name: example-items
        marker: "####"
        cardinality: "0..n"
        heading: free
        body: free
        description: 「具体例N：…」節の中の小項目。
      - name: diagram
        marker: "```pattern-diagram"
        cardinality: "0..1"
        heading: free
        body: none
        description: 概要ページの左下に置く SVG。フェンスの中身をそのまま図として描く。
    example: |
      ## パターン12
      <!--pattern-language-a-->
      number: 12
      name: 反証条件を先に書く
      category: 仮説検証
      oneliner: 何が起きたら崩れるかを、実験の前に一文で決める
      ### 状況・いつ使うか
      仮説を立てたが、検証の成否をどう判定するか決めていないとき。
      ### 問題・なぜ必要か
      後から基準を動かせると、どんな結果も「支持された」と読めてしまう。
      ### 何をするのか
      - 反証条件を一文で書く
      - 実験の前に確定させる
      ### 期待結果
      結果の解釈が一意に定まる。

  - name: WikiPattern
    label: WikiPattern
    plugin: wiki-pattern
    directives:
      - syntax: "<!--pattern-->"
    description: Wiki のパターン1件。左に いつ・なにが困るか／そこで、右に SVG の図解
    guidance: |
      **見出しは2つ。** 状況と問題は地続きの1つの話なので `いつ・なにが困るか` に束ね、
      打ち手は `そこで` で受ける（「こういう場面で、こう困る。**そこで**、こうする」）。
      節を分けずに束ねるのは、状況と問題を別々の話として読ませないため。

      **節の中の空行は段落の切れ目**として残り、2段落目からは見出しの無い節として
      同じ間隔で積まれる（節をまたぐ隙間と同じ 0.15in）。だから
      `いつ・なにが困るか` は「場面の段落」＋「困りごとの段落」の2つに割り、
      **困りごとの核は太字で1文に立てる**。

      **分量は 2行 + 3行 + 3行**（場面・困りごと・打ち手）、**1行は全角25字まで**。
      左段に入る本文は 2.84in ＝ 9行ぶんしかなく、超えた枚だけ箱が縮んで
      文字が箱からはみ出す（`validateLayout` は縮めた後を見るので止まらない）。
      25字はブラウザが1行に収める実測の上限で、26字を超えると折り返して
      見積りと1行ずれる。見出しが1つ減って増えたのは1行ぶんなので、
      増やすのは説明であって列挙ではない。

      **図解は必須。** SVG は md に書き込まず、**別ファイルに置いて `![…](….svg)` で参照する**
      （書き忘れたスライドは lint が報告し、変換でも止まる）。パターン・ランゲージは構造を
      一目で掴ませる形式なので、絵の無いパターンを置けないようにしてある。
      ファイルにするのは、md をそのまま GitHub で開いたときに図が絵として表示されるため。
      SVG 側は `viewBox` と、それに合った `width` / `height` を**実寸で**名乗ること
      （md での表示サイズになる）。埋め込むときは 100% に読み替え、右の下敷きのほうを
      `viewBox` の縦横比に合わせて組んで縦中央に置く。だから図は下敷きいっぱいに広がり、
      余白（レターボックス）も歪みも出ない。`viewBox` を名乗らない図だけは形が分からず、
      従来どおり列いっぱいの下敷きに入る。
    annotations: [id, takeaway, source]
    slots:
      - name: sections
        marker: "###"
        cardinality: "2"
        heading: vocabulary
        vocabulary: wiki-pattern-sections
        body: free
        description: |
          いつ・なにが困るか／そこで の2枠。左カラムに上から積まれる。
          本文中の空行は段落の切れ目として残り、2段落目からは見出しの無い節になる。
      - name: diagram
        marker: "![…](….svg)"
        cardinality: "1"
        heading: free
        body: none
        description: 右カラムに置く SVG ファイルへの参照。1スライドにつき必ず1つ。
    example: |
      ## 種ノート
      <!--pattern-->
      ### いつ・なにが困るか
      思いついたことを、後で書こうと思ったまま忘れる。
      思いつきは机の前ではなく、歩いている時に来る。

      **「ちゃんと書けてから」と待つと、その時は来ない。**
      整った文章には時間がいるが、思いつきは待てない。
      待つあいだに、思いついた時の熱まで消える。

      ### そこで
      **一文でよいから置く。** 見出しだけでもよい。
      書きかけのままでも、読み返せれば資産になる。
      育てるのは後の自分に。育て方は [[育つ見出し]]。

      ![種ノート](diagrams/patterns-wiki/種ノート.svg)

      <!--takeaway-->
      関連: [[一枚一義]]

# ── 語彙 ───────────────────────────────────────────────────────────
# slot の heading: vocabulary が参照する語彙。
# canonical = 正書、aliases = 受理される別表記（照合は小文字化してトリムしてから）
# pattern   = 固定名でなく正規表現で受理する項目（具体例N：… のような連番節）
# unknown   = 語彙外の見出しをどう扱うか（warning / error / ignore）
# sub-labels= その節の中で意味を持つ `**ラベル:**`。match は exact か contains-any。
vocabularies:
  lean-canvas-blocks:
    label: リーンキャンバスの9ブロック
    unknown: warning
    unknown-effect: どのマスにも入らず、そのブロックは描かれない
    terms:
      - key: problem
        canonical: 課題
        aliases: [problem]
        description: 上位3つの課題
      - key: solution
        canonical: ソリューション
        aliases: [solution, 解決策]
        description: 課題に対する打ち手
      - key: uvp
        canonical: 独自の価値提案
        aliases: [unique value proposition, uvp, 価値提案]
        description: なぜ違うのか・なぜ注目に値するのか
      - key: advantage
        canonical: 圧倒的な優位性
        aliases: [unfair advantage, advantage, 優位性]
        description: 簡単に真似できない強み
      - key: customer
        canonical: 顧客セグメント
        aliases: [customer segments, customer, 顧客]
        description: 対象とする顧客
      - key: metrics
        canonical: 主要指標
        aliases: [key metrics, metrics, 指標]
        description: 事業の健康を測る数値
      - key: channels
        canonical: チャネル
        aliases: [channels]
        description: 顧客への経路
      - key: cost
        canonical: コスト構造
        aliases: [cost structure, cost, コスト]
        description: 固定費・変動費
      - key: revenue
        canonical: 収益の流れ
        aliases: [revenue streams, revenue, 収益]
        description: 収益モデル

  journey-rows:
    label: カスタマージャーニーの行ラベル
    unknown: warning
    unknown-effect: その `####` 以下の箇条書きはどの行にも入らず描かれない
    guidance: 末尾のコロン（`:` / `：`）は書いても書かなくてよい（除去して照合する）。
    terms:
      - {key: touch,   canonical: タッチ, description: 顧客との接点}
      - {key: action,  canonical: 行動,   description: 顧客の行動}
      - {key: judge,   canonical: 判断,   description: 顧客の判断・評価}
      - {key: emotion, canonical: 感情,   description: 顧客の感情}

  pattern-sections:
    label: パターン・ランゲージの節
    unknown: warning
    unknown-effect: その節の内容は蓄積されず、丸ごと捨てられる
    terms:
      - key: situation
        canonical: 状況・いつ使うか
        description: 概要ページの「状況」。本文がそのまま入る。
      - key: problem
        canonical: 問題・なぜ必要か
        description: 概要ページの「問題」。本文がそのまま入る。
      - key: solution
        canonical: 何をするのか
        description: |
          概要ページの「解決」。`- ` で始まる行は原則(principles)として別枠に、
          それ以外の行は本文に入る。`**…**` だけの行は小見出しとして読み飛ばされる。
      - key: result
        canonical: 期待結果
        description: 概要ページの「期待結果」。
      - key: caution
        canonical: 注意
        description: 概要ページの「注意」。
      - key: success
        canonical: 成功例
        description: 詳細ページの成功例。`**ラベル:**` で小項目が切り替わる。
        sub-labels:
          match: exact
          terms:
            - {key: title,    canonical: タイトル}
            - {key: before,   canonical: Before}
            - {key: analysis, canonical: ズレ分析}
            - {key: after,    canonical: After}
      - key: failure
        canonical: 失敗例
        description: 詳細ページの失敗例。`**ラベル:**` で小項目が切り替わる。
        sub-labels:
          match: exact
          terms:
            - {key: title,       canonical: タイトル}
            - {key: attempt,     canonical: やったこと}
            - {key: problem,     canonical: 何がダメだったか}
            - {key: improvement, canonical: こうすればよかった}
      - key: concrete-example
        canonical: 具体例N：タイトル
        pattern: '^具体例[0-9０-９]+[：:](.+)$'
        description: |
          詳細ページの具体例。全角/半角の数字とコロンを受理する。`####` で小項目を作れる。
        sub-labels:
          match: contains-any
          terms:
            - {key: goodPoints,  contains: [ポイント]}
            - {key: goodExample, contains-all: [良い, 例]}
            - {key: badExample,  contains: [NG, 短すぎる]}
            - {key: badReason,   contains: [失敗]}
      - key: template
        canonical: テンプレート
        description: 詳細ページのテンプレート。コードフェンスの中身だけが使われる。
      - key: checklist
        canonical: セルフチェック
        description: 詳細ページのチェックリスト。`- [ ] 項目` の行だけが読まれる。
      - key: team-scenarios
        canonical: チーム活用シナリオ
        description: 詳細ページのシナリオ。`1. 項目` の番号付き行だけが読まれる。
      - key: comm-diagram-note
        canonical: コミュニケーション図メモ
        description: 意図的に読み捨てる節（描画されない作業メモ）。

  wiki-pattern-sections:
    label: Wiki パターンの2節
    unknown: error
    unknown-effect: どの枠にも入らず、その節は描かれない
    guidance: |
      2節そろって1つのパターンになる。順番は書いた順ではなく、この語彙の並び
      （いつ・なにが困るか → そこで）で左カラムに積まれる。

      **語彙外の見出しはエラーにする。** 3節だった頃の `### 問題` を書き残すと、
      警告のままでは中身ごと黙って消えた状態で公開されてしまう。ここだけ `error` なのは、
      1パターンの節が2つしかなく、1つ落ちれば残りが片肺だと分かりきっているため。
    terms:
      - key: situation
        canonical: いつ・なにが困るか
        aliases: [状況, いつ, situation]
        description: |
          どんな場面で、何が困るのか。本文がそのまま入る。
          空行で「場面の段落」と「困りごとの段落」に割り、困りごとの核は太字にする。
      - key: solution
        canonical: そこで
        aliases: [解決, どうする, solution]
        description: 打ち手。本文がそのまま入る。冒頭の一文を太字にして打ち手を立てる。

# ── フィールドセット（key: value 形式のメタ） ───────────────────────
# 現在 pattern-language ブロックだけが持つ。宣言に無いキーはタイポとして warning にする
# （実装は黙って meta に入れるだけで、どこにも描かれない）。
field-sets:
  pattern-meta:
    label: パターンのメタ
    layout: PatternLanguageOverview
    syntax: "`key: value` を1行ずつ。最初の `###` でメタ相が終わる。"
    guidance: |
      値の `"…"` と `[…]` は剥がされ、`\"` はアンエスケープされる。
      未宣言のキーは黙って捨てられるので、増やすときは必ずここへ宣言する。
    unknown: warning
    keys:
      - name: number
        required: true
        kind: text
        description: "パターン番号。目次(batch-html)がこれと name で項目を作る。"
        example: "12"
      - name: name
        required: true
        kind: text
        description: "パターン名。概要ページの見出しになる。"
        example: "反証条件を先に書く"
      - name: category
        required: false
        kind: text
        description: "分類。"
        example: "仮説検証"
      - name: stage
        required: false
        kind: text
        description: "適用段階。"
        example: "CPF"
      - name: oneliner
        required: false
        kind: text
        description: "一行要約。概要ページのリード文になる。"
        example: "何が起きたら崩れるかを、実験の前に一文で決める"
      - name: difficulty
        required: false
        kind: int
        description: "難易度。未指定は 0。"
        example: "3"
      - name: frequency
        required: false
        kind: int
        description: "頻度。未指定は 0。"
        example: "5"
      - name: related_patterns
        required: false
        kind: list
        separator: ","
        description: "関連パターン。カンマ区切り（`[...]` で囲んでもよい）。"
        example: "[P-03, P-07]"
      - name: takeaway
        required: false
        kind: text
        description: "まとめ。このレイアウトは `<!--takeaway-->` を使わずここで書く。"
      - name: reference
        required: false
        kind: text
        description: "出典。"

# ── インライン記法 ─────────────────────────────────────────────────
inline:
  effective-in: [section-heading, section-body, takeaway]
  not-effective-in-note: |
    プラグインがテキストを直接描く箇所（テーブルのセル・引用本文・ステップのラベル等）では
    `[[…]]` はそのままの文字として出る（BACKLOG B-22）。
  syntaxes:
    - {name: bold, syntax: "**text**", description: 太字}
    - {name: italic, syntax: "*text*", description: 斜体}
    - {name: code, syntax: "`text`", description: インラインコード}
    - {name: external-link, syntax: "[ラベル](https://example.com)", counts-chars: label,
       description: "外部リンク。HTML は `<a>`、PPTX はハイパーリンク。"}
    - {name: internal-link, syntax: "[[slide-id]]", counts-chars: label,
       description: 内部リンク。表示テキストは ID そのまま。解決できなければ素のテキストになる。}
    - {name: internal-link-labeled, syntax: "[[slide-id|表示テキスト]]", counts-chars: label,
       description: 表示テキストを指定した内部リンク。}

# ── 制限 ───────────────────────────────────────────────────────────
limits:
  max-chars-per-slide: 1000
  recommended-chars-per-slide: 240
  counts: 本文と見出し（Markdown 構文を除く）。リンクは表示ラベルだけを数え、URL は数えない。
  excluded-layouts: [CodeDisplay]
  guidance: |
    上限はレイアウトごとに `max-chars` で上書きできる。超過は ValidationError で止まる。
    上限の中でも読みやすさの目安は 240 文字程度で、これはツールでは強制しない。
