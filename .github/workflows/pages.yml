name: Build and publish slide wiki

# 公開は main だけ。作業ブランチや PR ではビルドもデプロイもしない。
# 公開サイトが常に main の内容と一致していることを、トリガの数で保証する。
on:
  push:
    branches:
      - main
    paths:
      - "slide-wiki/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# トリガが main への push（と手動実行）だけなので、単一グループでよい。
# 以前ここに PR 用の run が混ざり、後から始まった PR 側が
# cancel-in-progress で push 側を殺してデプロイが消えていた。
concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: slide-wiki/assets

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # setup-node の cache: npm は package-lock.json を要求するが、
      # このリポジトリは lockfile を追跡していない（assets/.gitignore）。
      # 同じ理由で npm ci も使えないため npm install を使う。
      # 代わりに ~/.npm を自前でキャッシュする。
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('slide-wiki/assets/package.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      # 【いったんの絞り込み】公開するのは「パターンを書く」の2本（meta）と索引（map）だけ。
      # map を残すのは、送りが最後の1枚で止まったあと索引から先頭へ戻る読み方
      # （order.yaml の「索引」グループの意図）を、絞った公開でも保つため。
      # 非公開デッキへのリンクは赤い未解決リンクとして表示される（クリックは無効）。
      # 他のデッキが公開に耐える状態になったら、build を `doc/wiki` に戻し、
      # 未解決リンクの検査から下の許容フィルタを外す（Spec.md の見本ページも戻す）。
      - name: Build the slide wiki (meta decks + map only)
        run: >
          npx tsx src/cli.ts --wiki --site-title "Slide Wiki"
          doc/wiki/intro-meta.md doc/wiki/patterns-meta.md doc/wiki/map.md
          _site/index.html

      - name: Fail if the wiki has unresolved links beyond the withheld decks
        run: |
          # meta だけの公開なので、非公開デッキへのリンクは未解決になるのが正しい。
          # 許すのはその向きだけで、公開デッキ内で折れたリンク（フラグメントの
          # 書き違いなど）は今まで通り止める。
          sed -n '/<details class="broken-report">/,/<\/details>/p' _site/index.html \
            | grep -oE '<li>[^<]*</li>' \
            | grep -vE '→ (guide|intro-wiki|patterns-wiki|seeds-self)\.md' \
            > unexpected-broken.txt || true
          if [ -s unexpected-broken.txt ]; then
            echo "::error::The wiki contains unresolved links that do not point at withheld decks."
            cat unexpected-broken.txt
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: slide-wiki/assets/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
